name: Release

# Require full CI on the tagged commit before building distributions.
# Publish to PyPI with Trusted Publishing (OIDC, no stored API token) and attach
# the wheel, source distribution and website to the GitHub Release.
#
# Setup (one-time, on PyPI): register the project "mirror-url", then add this
# repository as a Trusted Publisher (Project → Settings → Publishing):
#   Owner: bpodlipnik   Repo: mirror-url   Workflow: release.yml   Environment: pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: Full CI for tagged commit
    # A local workflow reference uses this tag's commit, not the current main.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install .
      - name: Check release website and CLI reference
        run: python scripts/render_site.py --check
      - run: python -m build
      - run: python -m pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: index.html

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # Opt-in: this job is skipped (not failed) until you set the repository
    # variable PUBLISH_TO_PYPI=true (Settings → Secrets and variables → Actions
    # → Variables). Enable it only after registering the PyPI Trusted Publisher
    # (see the header comment). Until then, releases still build the wheel and
    # attach it to the GitHub Release.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artifacts to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create/update the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: website/
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            website/index.html
          generate_release_notes: true
