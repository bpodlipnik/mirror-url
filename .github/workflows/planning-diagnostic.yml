name: Windows planning diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: planning-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeat:
    if: github.head_ref == 'codex/fix-windows-planning-fixture'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Repeat the exact zero-retry HTTPX case
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import pathlib
          import subprocess
          import sys

          for attempt in range(1, 41):
              directory = pathlib.Path("diagnostics/planning") / str(attempt)
              directory.parent.mkdir(parents=True, exist_ok=True)
              command = [
                  sys.executable, "-m", "pytest", "-q",
                  "tests/test_download_planning.py::test_real_small_file_mirror_reports_planning_heads_and_only_whole_file_gets[False-httpx]",
                  "--basetemp", str(directory),
              ]
              result = subprocess.run(command, capture_output=True, text=True,
                                      encoding="utf-8", errors="replace")
              print(f"Attempt {attempt}: returncode={result.returncode}", flush=True)
              if result.returncode:
                  print(result.stdout, flush=True)
                  print(result.stderr, flush=True)
                  raise SystemExit(result.returncode)
          print("All 40 diagnostic attempts passed", flush=True)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-planning-diagnostic
          path: diagnostics/
          if-no-files-found: warn
