[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-url"
version = "3.1.79"
description = "Security-hardened remote directory mirroring tool with adaptive concurrency, integrity checks, and SSRF-hardened transport."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BP" }]
keywords = ["mirror", "download", "http", "scraper", "directory", "async", "httpx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Archiving :: Mirroring",
]

# Core runtime dependencies (imported unconditionally by the package).
dependencies = [
    # [http2]: config.http2 defaults to True, so h2 is a hard runtime
    # requirement, not optional -- without it, AdaptiveAsyncManager's
    # client init raises on every single run (httpx refuses http2=True
    # without h2 installed), silently and permanently falling back to
    # the slower sync path. See CHANGELOG for the version this was fixed.
    "httpx[http2]>=0.24",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Optional accelerators / niceties — guarded by try/except in the code.
fast = ["stringzilla>=3.0", "lxml>=4.9"]
progress = ["tqdm>=4.65"]
monitor = ["psutil>=5.9"]
all = ["stringzilla>=3.0", "lxml>=4.9", "tqdm>=4.65", "psutil>=5.9"]

# Development / CI toolchain.
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "hypothesis>=6.0",
    "ruff==0.16.9",  # pinned exact: `ruff format` output isn't guaranteed stable
    # across versions, so an unpinned range lets CI drift out of sync with
    # what's actually committed (see CHANGELOG). Bump deliberately, re-run
    # `ruff format .`, and commit the result in the same PR.
    "black>=24.0",
    "mypy>=1.8",
    "types-PyYAML>=6.0",  # type stubs for the yaml import (silences import-untyped)
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/bpodlipnik/mirror-url"
Repository = "https://github.com/bpodlipnik/mirror-url"
Issues = "https://github.com/bpodlipnik/mirror-url/issues"

# Console entry point: the `mirror-url` command runs mirror_url.cli:main.
[project.scripts]
mirror-url = "mirror_url.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
# The canonical formatter is `ruff format` (see CI). Black is kept available for
# contributors who prefer it; exclude the frozen monolith so `black .` never
# rewrites it (mirrors the ruff `extend-exclude` below).
force-exclude = "mirror_url\\.py"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness-focused rule set. UP (pyupgrade) and SIM are intentionally
# omitted: this package is a verbatim port of working code that supports
# Python 3.9 with classic typing (Dict/Optional), and we don't want to churn
# ~350 lines of audited logic to modernize syntax or rewrite control flow.
# Bump requires-python to >=3.10 and re-enable UP if/when 3.9 is dropped.
select = ["E", "F", "W", "I", "B", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function call in argument defaults (intentional in a few places)
    # The following bugbear rule fires only on code carried over verbatim from
    # the original single-file script; deliberately preserved so the port
    # stays behavior-identical. Revisit during the optional core/ mixin
    # refactor (see REFACTORING_PLAN.md §4.1).
    "B007",  # unused loop control variable
    # B904 (raise ... from err) and B019 (lru_cache on a method --
    # MirrorURL._parse_url_cached) were ignored here for the same reason.
    # Both fixed: all 14 B904 sites now chain (or explicitly `from None`
    # where the new exception isn't caused by the caught one), and
    # _parse_url_cached delegates to a module-level cached function instead
    # of caching (self, url). No B904/B019 findings remain, so both rules
    # are enabled again.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
# Required, lenient type-checking. CI requires zero mypy errors. The settings
# below check annotated code without demanding annotations on every function
# or descending into untyped bodies. Shared mixin state and methods are declared
# in _core/_typing.py without changing the runtime inheritance structure.
# Tightening (disallow_untyped_defs, check_untyped_defs, strict) is a good
# incremental follow-up.
#
# python_version is the oldest interpreter mypy CHECKS against here, not the
# oldest one the package RUNS on (that's still requires-python = ">=3.9" in
# [project] above). mypy dropped the ability to check against a 3.9 target
# in the 2.x line (it now hard-errors with "Python 3.9 is not supported
# (must be 3.10 or higher)" instead of just warning), and mypy>=1.8 below has
# no upper bound, so any environment that installs a current mypy hits this.
# Bump this again if/when requires-python is bumped past 3.10.
python_version = "3.10"
files = ["src/mirror_url"]
ignore_missing_imports = true   # optional deps (stringzilla, lxml, tqdm, psutil) have no stubs
follow_imports = "silent"
disallow_untyped_defs = false
check_untyped_defs = false
# The original code predates strict implicit-Optional enforcement and relies on
# `param: T = None` in a few signatures. Restore the permissive behavior rather
# than churn the verbatim port; tighten alongside a dedicated typing pass.
no_implicit_optional = false
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = false
# The legacy monolith is not part of the package and is not type-checked.
exclude = ["mirror_url\\.py$", "tests/"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that exercise real I/O (deselect with -m 'not integration')",
]
