<style>
    :root { --fg:#1f2328; --muted:#656d76; --accent:#0969da; --border:#d0d7de;
            --code-bg:#f6f8fa; --table-alt:#f6f8fa; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
           color: var(--fg); line-height: 1.6; max-width: 900px; margin: 0 auto;
           padding: 2.5rem 1.25rem 5rem; }
    h1,h2,h3 { line-height: 1.25; margin-top: 2rem; }
    h1 { font-size: 2rem; border-bottom: 2px solid var(--border); padding-bottom: .4rem; }
    h2 { font-size: 1.45rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
    h3 { font-size: 1.15rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: var(--code-bg); padding: .15em .35em; border-radius: 6px;
           font-size: .88em; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    pre { background: var(--code-bg); padding: 1rem; border-radius: 8px; overflow-x: auto;
          border: 1px solid var(--border); }
    pre code { background: none; padding: 0; font-size: .85em; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: .5rem .7rem; text-align: left; vertical-align: top; }
    th { background: var(--code-bg); }
    tr:nth-child(even) td { background: var(--table-alt); }
    blockquote { border-left: 4px solid var(--accent); margin: 1rem 0; padding: .25rem 1rem;
                 color: var(--muted); background: #f6f8fa55; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  </style>
